name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Swift Test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Run tests
        run: swift test

  ios-build:
    name: iOS Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build iOS simulator
        run: xcodebuild -scheme ClinDeskAgentsOpenAI -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
